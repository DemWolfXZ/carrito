<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CarritoControl - Tus compras bajo control</title>

  <base href="/" />

  <!-- color-scheme: light CONGELA el tema a modo claro -->
  <!-- Esto previene que el navegador auto-oscurezca la app -->
  <!-- incluso si el usuario tiene Dark Mode en el sistema operativo -->
  <meta name="color-scheme" content="light" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <!-- Status bar styling - app no dibuja debajo de la barra de estado -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="theme-color" content="#ffffff" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
